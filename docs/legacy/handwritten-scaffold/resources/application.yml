# 若依应用配置（业务模块所需最小集）
# 完整版请从若依官方 ruoyi-admin/src/main/resources/application.yml 拷贝后合并
ruoyi:
  # 项目名称
  name: RuoYi
  # 版本
  version: 3.8.7
  # 版权年份
  copyrightYear: 2026
  # 上传路径（照片存储根目录）
  profile: ${user.home}/ruoyi/uploadPath
  # 地址开关
  addressEnabled: false

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 800
      min-spare: 30

spring:
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  servlet:
    multipart:
      # 单文件上限：1MB（照片要求 ≤300KB，留余量）
      max-file-size: 1MB
      max-request-size: 10MB
  # 资源文件访问路径（/profile/** 映射到上传目录）
  resources:
    static-locations: classpath:/META-INF/resources/, classpath:/resources/, classpath:/static/, classpath:/public/, file:${ruoyi.profile}
  # Redis
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms

# MyBatis
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper 分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger（生产环境请关闭）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 防止XSS攻击
xss:
  enabled: true
  excludes:
  urlPatterns: /system/*,/monitor/*,/tool/*

# 暴露监控端点（生产环境仅保留 health）
management:
  endpoints:
    web:
      exposure:
        include: health,info
